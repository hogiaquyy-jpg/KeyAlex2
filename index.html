<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>KeyAlex2 - Tao key</title>
<style>
  body { font-family: Segoe UI, Arial; background: #101014; color: #eee; max-width: 680px; margin: 30px auto; padding: 0 16px; }
  h2 { color: #fff; }
  .card { background: #181822; border: 1px solid #2c2c38; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 8px 0 4px; color: #a0a0b0; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px; border: 1px solid #3a3a48; background: #0c0c10; color: #fff; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #3c50b4; color: #fff; font-size: 15px; cursor: pointer; }
  button:hover { background: #4a5fd0; }
  .key { font-size: 18px; color: #7dff9b; font-weight: bold; word-break: break-all; }
  .err { color: #ff8080; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { border-bottom: 1px solid #2c2c38; padding: 6px; text-align: left; word-break: break-all; }
  .hint { color: #88889a; font-size: 13px; }
  .row2 { display: flex; gap: 10px; } .row2 > div { flex: 1; }
</style>
</head>
<body>
<h2>KeyAlex2 - Admin tao key</h2>

<div class="card">
  <label>API (de trong = dung chung trang web)</label>
  <input id="api" value="/api">
  <label>Admin Key (mac dinh server: 30012012)</label>
  <input id="adminkey" placeholder="30012012">
  <button onclick="doCheck()">Kiem tra ket noi</button>
  <span id="loginState" class="hint"></span>
</div>

<div class="card">
  <h3>Tao key moi</h3>
  <label>Ten san pham *</label>
  <input id="product" value="Free Fire">
  <div class="row2">
    <div><label>So luong</label><input id="qty" value="1"></div>
    <div><label>So lan kich hoat toi da</label><input id="maxact" value="1"></div>
  </div>
  <div class="row2">
    <div><label>Het han sau (ngay, trong = vinh vien)</label><input id="expdays" placeholder=""></div>
    <div><label>Tien to key</label><input id="prefix" placeholder=""></div>
  </div>
  <label>Email khach (tuy chon)</label>
  <input id="email" placeholder="">
  <label>Ghi chu</label>
  <input id="note" placeholder="">
  <button onclick="doCreate()">Tao key</button>
  <div id="result" style="margin-top:12px"></div>
</div>

<div class="card">
  <h3>Keys hien co <button onclick="doList()" style="margin:0;padding:6px 12px;font-size:13px">Tai lai</button></h3>
  <div id="keys"></div>
</div>

<script>
const $ = id => document.getElementById(id);
function base() {
  const v = $("api").value.trim();
  return v === "" ? "/api" : v.replace(/\/$/, "");
}
function headers() {
  const h = { "Content-Type": "application/json" };
  const ak = $("adminkey").value.trim();
  if (ak) h["X-Admin-Key"] = ak;
  return h;
}
async function doCheck() {
  $("loginState").textContent = "...";
  try {
    const r = await fetch(base() + "/admin/keys", { headers: headers() });
    if (r.status === 401) { $("loginState").textContent = "Sai Admin Key (401)"; return; }
    const j = await r.json();
    $("loginState").textContent = "OK - " + (Array.isArray(j) ? j.length : 0) + " key";
  } catch (e) { $("loginState").textContent = "Loi ket noi: " + e.message; }
}
async function doCreate() {
  $("result").innerHTML = "...";
  const body = {
    product_name: $("product").value,
    quantity: parseInt($("qty").value) || 1,
    max_activations: parseInt($("maxact").value) || 1
  };
  if ($("expdays").value.trim() !== "") body.expires_in_days = parseInt($("expdays").value);
  if ($("prefix").value.trim() !== "") body.prefix = $("prefix").value.trim();
  if ($("email").value.trim() !== "") body.customer_email = $("email").value.trim();
  if ($("note").value.trim() !== "") body.note = $("note").value.trim();
  try {
    const r = await fetch(base() + "/admin/generate-keys", {
      method: "POST", headers: headers(), body: JSON.stringify(body)
    });
    if (r.status === 401) { $("result").innerHTML = '<span class="err">Sai Admin Key</span>'; return; }
    const j = await r.json();
    if (j.keys && j.keys.length) {
      let h = "<div>Tao duoc " + j.keys.length + " key:</div>";
      for (const k of j.keys) h += '<div class="key">' + k + '</div>';
      h += '<button onclick="copyAll()">Copy tat ca</button>';
      window._lastKeys = j.keys;
      $("result").innerHTML = h;
    } else {
      $("result").innerHTML = '<span class="err">That bai: ' + (j.message || JSON.stringify(j)) + "</span>";
    }
  } catch (e) { $("result").innerHTML = '<span class="err">Loi ket noi: ' + e.message + "</span>"; }
}
function copyAll() { navigator.clipboard.writeText((window._lastKeys || []).join("\n")); alert("Da copy"); }
async function doList() {
  $("keys").textContent = "...";
  try {
    const r = await fetch(base() + "/admin/keys", { headers: headers() });
    if (r.status === 401) { $("keys").textContent = "Sai Admin Key"; return; }
    const j = await r.json();
    const arr = Array.isArray(j) ? j : (j.keys || j.data || []);
    if (!arr.length) { $("keys").textContent = "(trong)"; return; }
    let h = "<table><tr><th>Key</th><th>SP</th><th>TT</th><th>Da kich hoat</th><th>Het han</th></tr>";
    for (const k of arr) {
      h += "<tr><td>" + (k.license_key || k.key || "") + "</td><td>" + (k.product_name || "") + "</td><td>" + (k.status || "") + "</td><td>" + (k.activations_used != null ? k.activations_used + "/" + k.max_activations : "") + "</td><td>" + (k.expires_at || k.expires || "") + "</td></tr>";
    }
    $("keys").innerHTML = h + "</table>";
  } catch (e) { $("keys").textContent = "Loi: " + e.message; }
}
</script>
</body>
</html>
